<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.b{fill:#edf6ff;stroke:#4d89bd;stroke-width:2}.c{fill:#d9f2df;stroke:#409460;stroke-width:2}</style><rect width="960" height="290" fill="#fbfdff"/><text x="480" y="35" text-anchor="middle" font-size="24" font-weight="bold">单步动作与 Action Chunk</text><text x="55" y="95" font-size="18">单步：</text><g class="b"><rect x="130" y="65" width="70" height="48" rx="6"/><rect x="220" y="65" width="70" height="48" rx="6"/><rect x="310" y="65" width="70" height="48" rx="6"/></g><g text-anchor="middle" font-size="15"><text x="165" y="95">aₜ</text><text x="255" y="95">aₜ₊₁</text><text x="345" y="95">aₜ₊₂</text></g><text x="55" y="185" font-size="18">分块：</text><rect class="c" x="130" y="145" width="270" height="55" rx="8"/><rect class="c" x="430" y="145" width="270" height="55" rx="8"/><g text-anchor="middle" font-size="16"><text x="265" y="178">Aₜ = [aₜ … aₜ₊ₕ₋₁]</text><text x="565" y="178">Aₜ₊₁ = [aₜ₊₁ …]</text></g><text x="480" y="248" text-anchor="middle" font-size="15">执行前几步后重观测并重新预测：receding horizon。</text></svg>
