<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#18324a}.t{font-size:18px}.s{font-size:14px}.b{fill:#edf6ff;stroke:#4f8dbd;stroke-width:2}.g{fill:#e8f6ea;stroke:#5b9d70;stroke-width:2}.o{fill:#fff1e5;stroke:#db8b45;stroke-width:2}.p{fill:#f1ecff;stroke:#7f67bb;stroke-width:2}.a{stroke:#5c7892;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#5c7892"/></marker></defs><rect width="1280" height="580" fill="#fbfdff"/><text x="640" y="42" text-anchor="middle" font-size="27" font-weight="bold">机器人相机图像如何进入 VLA：从像素到多模态 Token</text><rect class="b" x="35" y="130" width="190" height="190" rx="12"/><text x="130" y="112" text-anchor="middle" class="t" font-weight="bold">前视 RGB 图像</text><g stroke="#8ab4cf" stroke-width="1"><path d="M35 177h190M35 224h190M35 271h190M82 130v190M129 130v190M176 130v190"/></g><circle cx="130" cy="213" r="35" fill="#e94e55"/><rect x="150" y="255" width="45" height="35" fill="#4d90d9"/><text x="130" y="350" text-anchor="middle" class="s">[B, 3, 224, 224]</text><path class="a" d="M235 225h75"/><rect class="g" x="320" y="130" width="205" height="190" rx="12"/><text x="422" y="112" text-anchor="middle" class="t" font-weight="bold">Patch Embedding</text><g fill="#a9d9e9" stroke="#4f8dbd"><rect x="350" y="155" width="35" height="35"/><rect x="390" y="155" width="35" height="35"/><rect x="430" y="155" width="35" height="35"/><rect x="350" y="195" width="35" height="35"/><rect x="390" y="195" width="35" height="35"/><rect x="430" y="195" width="35" height="35"/></g><text x="422" y="260" text-anchor="middle" class="s">16×16 切块 + 线性投影</text><text x="422" y="285" text-anchor="middle" class="s">196 个视觉 token</text><text x="422" y="350" text-anchor="middle" class="s">[B, 196, 768]</text><path class="a" d="M535 225h75"/><rect class="p" x="620" y="106" width="220" height="240" rx="12"/><text x="730" y="87" text-anchor="middle" class="t" font-weight="bold">多模态序列</text><rect x="650" y="135" width="160" height="28" fill="#a9d9e9"/><rect x="650" y="172" width="160" height="28" fill="#a9d9e9"/><rect x="650" y="209" width="160" height="28" fill="#c1e5c8"/><rect x="650" y="246" width="160" height="28" fill="#f5c899"/><rect x="650" y="283" width="160" height="28" fill="#f5c899"/><text x="730" y="154" text-anchor="middle" class="s">前视 / 腕部 Image Tokens</text><text x="730" y="228" text-anchor="middle" class="s">Robot State Token</text><text x="730" y="265" text-anchor="middle" class="s">Language Tokens</text><text x="730" y="335" text-anchor="middle" class="s">[B, N, 768]</text><path class="a" d="M850 225h75"/><rect class="o" x="935" y="130" width="165" height="190" rx="12"/><text x="1017" y="112" text-anchor="middle" class="t" font-weight="bold">Transformer</text><text x="1017" y="190" text-anchor="middle" class="s">Self-Attention</text><text x="1017" y="220" text-anchor="middle" class="s">融合物体、指令</text><text x="1017" y="250" text-anchor="middle" class="s">与机器人状态</text><text x="1017" y="350" text-anchor="middle" class="s">[B, N, 768]</text><path class="a" d="M1110 225h65"/><rect class="g" x="1180" y="160" width="75" height="125" rx="12"/><text x="1217" y="200" text-anchor="middle" class="s">动作头</text><text x="1217" y="225" text-anchor="middle" class="s">Δx Δy Δz</text><text x="1217" y="248" text-anchor="middle" class="s">ΔR + gripper</text><text x="640" y="500" text-anchor="middle" class="t">关键不是把所有数据“拼起来”，而是明确每种 token 的来源、顺序、shape、时间戳与物理语义。</text></svg>
