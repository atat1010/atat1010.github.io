<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.b{fill:#eaf4ff;stroke:#4d89bd;stroke-width:2}.a{stroke:#4d89bd;stroke-width:3}</style><rect width="1200" height="260" fill="#fbfdff"/><text x="600" y="42" text-anchor="middle" font-size="25" font-weight="bold">从动作监督到预测未来：学习依赖关系</text><g text-anchor="middle" font-size="17"><g class="b"><rect x="20" y="105" width="150" height="55" rx="9"/><rect x="215" y="105" width="150" height="55" rx="9"/><rect x="410" y="105" width="150" height="55" rx="9"/><rect x="605" y="105" width="150" height="55" rx="9"/><rect x="800" y="105" width="150" height="55" rx="9"/><rect x="995" y="105" width="180" height="55" rx="9"/></g><text x="95" y="139">策略与数据 01–03</text><text x="290" y="139">基础策略 04–05</text><text x="485" y="139">多模态表征 06</text><text x="680" y="139">VLA 演进 07–09</text><text x="875" y="139">世界模型 10–12</text><text x="1085" y="139">部署与项目 13–14</text></g><g class="a"><path d="M170 132h40"/><path d="M365 132h40"/><path d="M560 132h40"/><path d="M755 132h40"/><path d="M950 132h40"/></g><text x="600" y="220" text-anchor="middle" font-size="16">先把数据、坐标系和控制闭环做对，再扩展模型规模与预测能力。</text></svg>
