<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#18324a}.h{font-size:24px;font-weight:bold}.t{font-size:17px}.s{font-size:14px}.b{fill:#eaf4ff;stroke:#4d89bd;stroke-width:2}.g{fill:#e8f6ea;stroke:#579b68;stroke-width:2}.o{fill:#fff0e4;stroke:#d88943;stroke-width:2}.a{stroke:#5c7892;stroke-width:3;fill:none}</style><rect width="1200" height="500" fill="#fbfdff"/><text x="600" y="40" text-anchor="middle" class="h">Diffusion Policy：条件去噪生成 Action Chunk</text><rect class="b" x="45" y="135" width="170" height="100" rx="12"/><text x="130" y="170" text-anchor="middle" class="t">观测条件 c</text><text x="130" y="197" text-anchor="middle" class="s">图像 + 状态 + 指令</text><rect class="g" x="45" y="285" width="170" height="75" rx="12"/><text x="130" y="316" text-anchor="middle" class="t">真实动作 A₀</text><text x="130" y="340" text-anchor="middle" class="s">[B, H, Da]</text><path class="a" d="M215 322h92"/><text x="260" y="305" text-anchor="middle" class="s">随机加噪</text><rect class="o" x="315" y="285" width="170" height="75" rx="12"/><text x="400" y="316" text-anchor="middle" class="t">加噪动作 Aₖ</text><text x="400" y="340" text-anchor="middle" class="s">几乎纯噪声</text><path class="a" d="M485 322h80"/><rect class="b" x="575" y="165" width="220" height="190" rx="12"/><text x="685" y="205" text-anchor="middle" class="t">条件去噪网络 εθ</text><text x="685" y="235" text-anchor="middle" class="s">输入：Aₖ、k、c</text><text x="685" y="262" text-anchor="middle" class="s">输出：预测噪声 [B,H,Da]</text><path class="a" d="M215 185h360"/><path class="a" d="M795 260h75"/><rect class="g" x="880" y="215" width="155" height="90" rx="12"/><text x="957" y="248" text-anchor="middle" class="t">反向采样</text><text x="957" y="272" text-anchor="middle" class="s">重复 10 次</text><path class="a" d="M1035 260h65"/><rect class="o" x="1105" y="215" width="70" height="90" rx="12"/><text x="1140" y="246" text-anchor="middle" class="s">动作块</text><text x="1140" y="270" text-anchor="middle" class="s">执行前缀</text><text x="600" y="440" text-anchor="middle" class="t">扩散时间步 k 是噪声等级；机器人控制时刻仍由 Action Chunk 的 H 个元素决定。</text></svg>
