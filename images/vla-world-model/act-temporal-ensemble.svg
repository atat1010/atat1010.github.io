<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#18324a}.h{font-size:24px;font-weight:bold}.t{font-size:17px}.s{font-size:14px}.a{fill:#eaf4ff;stroke:#4d89bd;stroke-width:2}.b{fill:#e9f6ea;stroke:#579b68;stroke-width:2}.c{fill:#fff0e4;stroke:#d88943;stroke-width:2}</style><rect width="1200" height="520" fill="#fbfdff"/><text x="600" y="40" text-anchor="middle" class="h">ACT：预测长 Action Chunk，但在闭环中只执行前缀</text><text x="65" y="96" class="t">时刻 t=120 的预测</text><rect class="a" x="220" y="68" width="120" height="48" rx="7"/><rect class="a" x="345" y="68" width="120" height="48" rx="7"/><rect class="a" x="470" y="68" width="120" height="48" rx="7"/><rect class="a" x="595" y="68" width="120" height="48" rx="7"/><text x="280" y="98" text-anchor="middle" class="s">a₁₂₀ … a₁₂₉</text><text x="530" y="98" text-anchor="middle" class="s">…</text><text x="655" y="98" text-anchor="middle" class="s">a₁₂₁₉</text><text x="65" y="178" class="t">时刻 t=121 的预测</text><rect class="b" x="245" y="150" width="120" height="48" rx="7"/><rect class="b" x="370" y="150" width="120" height="48" rx="7"/><rect class="b" x="495" y="150" width="120" height="48" rx="7"/><text x="305" y="180" text-anchor="middle" class="s">a₁₂₁ …</text><text x="550" y="180" text-anchor="middle" class="s">… a₁₂₂₀</text><path d="M280 120v55M405 120v55" stroke="#7b9db7" stroke-dasharray="5 4"/><text x="850" y="135" class="s">重叠的绝对时刻动作</text><path d="M845 145h-230" stroke="#d88943" stroke-width="2"/><rect class="c" x="720" y="245" width="210" height="58" rx="10"/><text x="825" y="271" text-anchor="middle" class="t">Temporal Ensemble</text><text x="825" y="292" text-anchor="middle" class="s">对同一时刻候选加权</text><path d="M590 95 C670 95 690 230 740 250" fill="none" stroke="#5c7892" stroke-width="3"/><path d="M615 175 C680 175 700 235 740 260" fill="none" stroke="#5c7892" stroke-width="3"/><path d="M930 274h90" stroke="#5c7892" stroke-width="3"/><rect class="b" x="1025" y="245" width="130" height="58" rx="10"/><text x="1090" y="271" text-anchor="middle" class="t">执行 m=10 步</text><text x="1090" y="292" text-anchor="middle" class="s">再观测、再预测</text><path d="M1088 305v90h-860v-145" fill="none" stroke="#5c7892" stroke-width="3"/><text x="600" y="460" text-anchor="middle" class="t">H=100 描述 5 秒意图；m=10 保留 0.5 秒一次的闭环纠偏（20 Hz 示例）。</text></svg>
