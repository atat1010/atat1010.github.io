<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#18324a}.h{font-size:24px;font-weight:bold}.t{font-size:17px}.s{font-size:14px}.b{fill:#eaf4ff;stroke:#4d89bd;stroke-width:2}.g{fill:#e8f6ea;stroke:#579b68;stroke-width:2}.o{fill:#fff0e4;stroke:#d88943;stroke-width:2}</style><rect width="1200" height="470" fill="#fbfdff"/><text x="600" y="40" text-anchor="middle" class="h">机器人数据契约：时间对齐 + 坐标系 + 单位 + 控制频率</text><line x1="100" y1="250" x2="1100" y2="250" stroke="#5c7892" stroke-width="3"/><g class="s"><text x="95" y="285">11.94s</text><text x="390" y="285">11.997s</text><text x="600" y="285">12.000s</text><text x="720" y="285">12.006s</text></g><line x1="600" y1="90" x2="600" y2="380" stroke="#d88943" stroke-width="3" stroke-dasharray="6 4"/><text x="600" y="72" text-anchor="middle" class="t">控制参考时刻 t=12.000s</text><rect class="b" x="315" y="125" width="160" height="68" rx="10"/><text x="395" y="153" text-anchor="middle" class="t">前视相机</text><text x="395" y="176" text-anchor="middle" class="s">11.997s，RGB</text><line x1="395" y1="193" x2="395" y2="250" stroke="#4d89bd" stroke-width="3"/><rect class="g" x="640" y="125" width="160" height="68" rx="10"/><text x="720" y="153" text-anchor="middle" class="t">腕部相机</text><text x="720" y="176" text-anchor="middle" class="s">12.006s，RGB</text><line x1="720" y1="193" x2="720" y2="250" stroke="#579b68" stroke-width="3"/><rect class="o" x="515" y="325" width="170" height="75" rx="10"/><text x="600" y="355" text-anchor="middle" class="t">状态 / Action</text><text x="600" y="379" text-anchor="middle" class="s">base frame，m / rad，20 Hz</text><text x="600" y="435" text-anchor="middle" class="t">最大 skew = 6 ms ≤ 20 ms：样本有效；frame 或单位未记录：样本不可安全复用。</text></svg>
