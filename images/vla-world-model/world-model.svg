<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.b{fill:#eef6ff;stroke:#4d89bd;stroke-width:2}.g{fill:#e6f5ea;stroke:#4f9a69;stroke-width:2}</style><rect width="1100" height="280" fill="#fbfdff"/><text x="550" y="46" text-anchor="middle" font-size="24" font-weight="bold">控制型世界模型：预测对决策有用的未来</text><g text-anchor="middle" font-size="17"><g class="b"><rect x="25" y="100" width="140" height="58" rx="9"/><rect x="220" y="100" width="140" height="58" rx="9"/><rect x="805" y="100" width="140" height="58" rx="9"/><rect x="975" y="100" width="100" height="58" rx="9"/></g><g class="g"><rect x="415" y="100" width="140" height="58" rx="9"/><rect x="610" y="100" width="140" height="58" rx="9"/></g><text x="95" y="135">真实观测 oₜ</text><text x="290" y="135">编码器</text><text x="485" y="135">潜状态 zₜ</text><text x="680" y="135">动力学 f(z,a)</text><text x="875" y="135">价值 / 规划器</text><text x="1025" y="135">机器人</text></g><g stroke="#507896" stroke-width="3"><path d="M165 129h50"/><path d="M360 129h50"/><path d="M555 129h50"/><path d="M750 129h50"/><path d="M945 129h25"/></g><text x="550" y="225" text-anchor="middle" font-size="15">可预测像素、潜表征或奖励/价值；后两者通常更适于实时控制。</text></svg>
